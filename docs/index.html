<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recommended Places</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <header class="site-header">

            <div>
                <h1>Recommended Places</h1>

                <p>
                    Curated places worth visiting,
                    eating, shopping and experiencing.
                </p>
            </div>

        </header>


        <!-- COUNTRY CONTROLS -->

        <section class="country-controls">

            <div class="country-display">

                <span id="countryFlag">
                    🌎
                </span>

                <span id="countryName">
                    Loading...
                </span>

            </div>


            <div class="selectors">

                <select id="regionSelect">
                    <option value="">
                        Select region
                    </option>

                    <option value="north-america">
                        North America
                    </option>

                    <option value="europe">
                        Europe
                    </option>

                    <option value="asia">
                        Asia
                    </option>
                </select>


                <select id="countrySelect">
                    <option value="">
                        Select country
                    </option>
                </select>

            </div>

        </section>


        <!-- CATEGORY FILTERS -->

        <section class="category-section">

            <div
                class="category-buttons"
                id="categoryButtons"
            >

                <button
                    type="button"
                    class="category-button active"
                    data-category="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="sightseeing"
                >
                    Sightseeing
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="restaurants"
                >
                    Restaurants
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="nightlife"
                >
                    Nightlife
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="shopping"
                >
                    Shopping
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="experiences"
                >
                    Experiences
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="hobbies"
                >
                    Hobbies
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="meetups"
                >
                    Meetups
                </button>

            </div>

        </section>


        <!-- RESULT COUNT -->

        <div id="resultCount">
            Loading recommendations...
        </div>


        <!-- PLACE CARDS -->

        <main>

            <section
                id="placesContainer"
                class="places-grid"
            >
                <div class="empty-state">

                    <h3>
                        Finding places...
                    </h3>

                    <p>
                        Loading recommendations.
                    </p>

                </div>
            </section>

        </main>


        <!-- FOOTER -->

        <footer class="site-footer">

            <p>
                Place information is gathered
                automatically from open APIs.
            </p>

        </footer>

    </div>


    <script src="app.js"></script>

</body>
</html>
